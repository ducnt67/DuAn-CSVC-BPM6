databases:
  - name: due-facility-db
    databaseName: due_facility
    user: due_facility_user
    plan: free

services:
  - type: web
    name: due-facility-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py seed_demo
    startCommand: gunicorn config.wsgi:application
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: due-facility-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: due-facility-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: DB_CONNECT_TIMEOUT
        value: "10"
